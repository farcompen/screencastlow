name: Build ScreenCast APKs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Sender and Receiver
        run: ./gradlew clean :sender:assembleDebug :receiver:assembleDebug --stacktrace

      - name: Upload Sender APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenCast-Sender-v5
          path: sender/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Receiver APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenCast-Receiver-v5
          path: receiver/build/outputs/apk/debug/*.apk
          if-no-files-found: error
